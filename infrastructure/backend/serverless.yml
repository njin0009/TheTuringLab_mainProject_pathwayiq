service: pathwayiq-backend

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-southeast-2
  environment:
    DATABASE_URL: ${ssm:/pathwayiq/DATABASE_URL}
    ALLOWED_ORIGIN: ${env:ALLOWED_ORIGIN, "*"}

functions:
  search:
    handler: src/search.handler
    events:
      - httpApi:
          path: /careers
          method: GET
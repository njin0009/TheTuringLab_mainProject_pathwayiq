name: Frontend CI

on:
  push:
    branches: [main]
    paths:    ["apps/web/**"]
  pull_request:
    paths:    ["apps/web/**"]

jobs:
  build:
    name: Type check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://placeholder.execute-api.ap-southeast-2.amazonaws.com/prod
